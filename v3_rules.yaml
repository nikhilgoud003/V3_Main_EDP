counsel_tag_tokens:
  source: 'user (counsel step - strip trailing tags like "-DOJ", "(USAO)"); tokens seen as trailing tags in the pilot'
  words: [doj, usao, ausa, sausa, fpd, cja, usa, crm, civ, tax, enrd, atr, oag]

# ---------------------------------------------------------------- parties
government_party_names:
  source: user (fix 1, ctx2 step). NOTE - this names one specific entity (the federal government as a party); kept
    because the user asked for it explicitly, flagged against the "no specific entity" rule.
  names: ["united states of america", "united states", "usa", "us", "u s a", "u s", "united states america"]
  not_if_contains: "ex rel"


placeholder_party:
  source: 'user (fix 2 - placeholders - Unknown, Defendant(s), et al, Doe)'
  words: [doe, does, unknown, unnamed, "et al"]
  exact_names: [defendant, defendants, "defendant s", plaintiff, plaintiffs, "plaintiff s"]

party_evidence:
  source: choice (ctx step); RARE_* and COPARTY_* are thresholds I picked, see REPORT_ctx.md
  rare_max_cases: 3
  rare_person_min_tokens: 3
  coparty_max_cases: 10
  coparty_max_parties_in_case: 200

# ---------------------------------------------------------------- firms
federal_offices:
  source: user (ctx step - "U.S. Attorney / Federal Public Defender kept per district, whole words"). NOTE - these name
    two specific office types; kept because the user asked for them explicitly, flagged against the "no specific
    entity" rule.
  usao_pattern: |-
    \b(?:united states|u s|us)\s+attorneys?\b|\busao\b
  fpd_pattern: |-
    \bfederal\s+(?:public\s+|community\s+)?defenders?\b|\bfpd\b

# ---------------------------------------------------------------- judges (step 2)
judges:
  strip_parenthetical:
    source: 'data (large-district judge audit - "Magistrate Judge <name> (Settlement)"); bracketed text is not part of a judge name'
    pattern: |-
      \([^)]*\)
  title_typos:
    source: 'data (large-district same-surname audit - "Jude <surname>", "Judgte <surname>", "Juge <surname>", "Judges <surname>"); removed like titles'
    words: [jude, judges, judgte, juge, jduge, judgee, magistrat]
  title_evidence:
    source: 'user (step 2 - keep the title Magistrate / District / Bankruptcy as evidence); U.S.M.J. / U.S.D.J. are the standard abbreviations'
    titles:
      magistrate: [magistrate, "u s m j", usmj]
      district: [district, "u s d j", usdj]
      bankruptcy: [bankruptcy]
  typo:
    source: 'user (step 2 - same court + same surname + first name 1 edit apart, unless both spellings have 20+ mentions).
      "1 edit" uses optimal string alignment distance, so a swapped letter pair (Kieth / Keith) is one edit.
      min_first_name_length is my choice so initials never count as typos.'
    max_first_name_edits: 1
    min_first_name_length: 3
    both_frequent_min_mentions: 20
  surname_only:
    source: 'user (step 2 - same case, then same division (number before ":" in the case ID), then same court; else one unresolved record per surname per court)'
    levels: [case, division, court]
    unresolved_id_prefix: SJU

# ---------------------------------------------------------------- organisations / agencies (step 4)
organisations:
  legal_form_rule:
    source: 'user (finish job, fix 3) - legal_type_only = remove the parts probablepeople tags CorporationLegalType (Inc., LLC,
      P.C., Ltd., PLC). legal_type_and_trailing_org_type = also remove ONE final word the parser tags
      CorporationNameOrganization (Company, Co., Corp., Corporation) when two or more name words remain.'
    value: legal_type_only
  acronym:
    source: 'user (step 4, revised) - an all-caps token is an organisation acronym ONLY if it equals the initials of an organisation
      name in the same court (initials ignore initials_skip_words) or carries a division suffix such as "-CID"; otherwise it stays
      under the person rule. Initials are collected per court over saved data + the whole input batch before matching, so both
      arrival orders give the same result within a run. Lengths are my choice.'
    min_length: 3
    max_length: 8
    initials_skip_words: [of, the, and, for, on, in, at, to, a, an]

# ---------------------------------------------------------------- lawyers (step 5)
counsel:
  pro_se:
    source: 'data (large-district run) - the JSON flag parties[].counsel[].is_pro_se marks pro se entries (9,646 in that run) and they get no counsel
      or firm mention. Text "pro se" without the flag (11 entries) and counsel named like their own party (101) were checked: they
      are lawyers (e.g. attorneys who are parties), so no extra text rule is added.'
    rule: is_pro_se flag
  no_contact:
    source: 'user (step 5) - counsel with no email / phone / address / office: same full name including a middle initial in the same
      court, or the same name representing the same party ID -> one ID. "Same name" = same first and last name, middle names not
      conflicting (my reading). full_name_min_tokens = first + middle + last.'
    full_name_min_tokens: 3

# ---------------------------------------------------------------- docket-text judges (clean-up job)
docket_judges:
  rule:
    source: 'user (clean-up fix 1) - a docket mention first joins a known judge. If it matches none, it goes to the pending pool
      (pending_judges.jsonl in the output folder), never dropped. A pending name becomes a judge ID only when it has a first AND
      last name, carries a judge title in the docket phrase, and appears in min_cases different cases; it is then promoted with all
      its earlier mentions. One-word names never create a judge; they can only join a known judge. Pending mentions are re-checked
      at the end of every run, so results do not depend on file order or batch size. Option A (user, clean-up fix round 2): a
      first + last name that is on the FJC list (fjc_list below) is promoted when its judge title is seen in at least 1 case.'
    min_cases: 3
    title_words: ["judge", "magistrate judge", "bankruptcy judge"]
  trailing_words:
    source: 'data (compute_trailing_words.py) - last words of the large-district run docket judge captures (dropped "<judge> <word>" rows in
      the clean-up run and judge variants in the final large-district run that are another judge plus one word), kept when seen 10+ times,
      absent from the Census 1990 surname list, not a name suffix and not an FJC judge last name. Trailing words in this list or in
      judges.non_name_words are trimmed from a judge name instead of dropping it; a docket name is also trimmed to the longest
      start equal to a known judge name.'
    words: ["motion", "selection", "parties", "hearing", "dispositive", "appearances", "plea", "trial", "pretrial", "conference", "voir", "joinder", "detention", "unassigned", "proposed", "defendant", "deft", "final", "status", "deadline", "the", "sentencing", "initial", "notification", "counsel", "responses", "pltf", "joint"]

  fjc_list:
    source: 'reference - FJC Biographical Directory of Article III judges (public export from fjc.gov; 4,074 judges in the copy used).
      Used for the judge-vs-FJC report. A relative path is resolved next to this rules file.'
    path: data/judges_fjc.csv
  first_name_only:
    source: 'reference - US Census Bureau 1990 name files (www2.census.gov/topics/genealogy/1990surnames: dist.male.first,
      dist.female.first, dist.all.last). A single-word judge name is "first-name-like" when it is more frequent as a first name
      (max of male / female %) than as a surname. Such a mention never creates a judge ID: it joins the one judge in the same case
      with that first name, else it is dropped and logged.'
    male_first: data/census1990_dist.male.first.txt
    female_first: data/census1990_dist.female.first.txt
    surnames: data/census1990_dist.all.last.txt

# ---------------------------------------------------------------- type gate (clean-up job)
type_gate:
  source: 'user (clean-up job, item 1) - only judge / counsel / firm / party entities may be created; court staff, placeholders and
    junk are dropped and logged in dropped_entities.jsonl. Word lists come from the large-district audit of the most frequent staff- and
    junk-looking names (report_staff_roles.txt): city interpreters, probation / pretrial / marshal desks and court case managers
    entered as counsel, "Attorney at Law" / "State Bar Information" as firms, "Incorrectly Filed" as a party.'
  rawinfo_staff_phrases:
    source: 'data (large-district audit, report_staff_roles.txt) - kept on purpose: a counsel / firm record whose name, or a counsel record
      whose raw_info (with no email), names one of these court-staff ROLES is court staff, not a lawyer or law office. The name
      gate cannot see roles (a clerk''s name is a PERSON, an interpreter desk is an ORGANISATION), so this is the one role list
      left; it is never used to decide whether a string is a name.'
    phrases: [interpreter, interpreters, translator, translators, "court reporter", "court reporters", "case manager",
              "case managers", "courtroom deputy", "deputy clerk", clerk, probation, pretrial, "pretrial services",
              "pretrial svcs", marshal, marshals, "court recorder", "electronic recorder", ero, "court security officer"]
  placeholders:
    source: 'data (large-district audit) + answer key firm rules ("Attorney at Law" is not a firm; "<Name>, Attorney at Law" is). Exact match on
      the cleaned name.'
    counsel: ["attorney at law", "atty at law", attorney, "see above", none, unknown, "pro se", "n a"]
    firm: ["attorney at law", "atty at law", attorney, "attorneys at law", "law office", "law offices", "see above",
           "see above for address", none, unknown, "pro se", "n a"]
    firm_prefixes: ["state bar information"]
    party: ["incorrectly filed", "filed in error", "wrong person on case", "wrong party", none]
  junk_rule:
    source: 'choice (revised after the pilot check) - a name is junk only when it has no letter at all. Names made of initials
      ("A.B.", "J.M.S.T." - often minors) and short company names ("3M", "A C & S, Inc.") are real parties and are kept.'
    must_contain_pattern: '[a-z]'
  bar_pattern:
    source: 'choice - a bar number in raw_info is lawyer evidence'
    pattern: |-
      \bbar\s*(?:no|number|#|id)\b|\bstate\s+bar\b

# ---------------------------------------------------------------- name gate (v3_names.NameGate)
name_gate:
  source: 'user (finish job, fix 2) - PERSON / ORGANISATION / NOT_ENTITY from two pretrained models, run once per distinct string
    and cached in name_gate_cache.jsonl: spaCy NER (en_core_web_md; on the docket sentence when there is one; an entity must
    cover 60% of the name) and probablepeople (Person vs Corporation; on a repeated-label error its own token labels decide).
    Agreement decides. Disagreement: a judge in the case judge field, a known judge in the court or an FJC-listed name is a
    PERSON; a known lawyer / firm / party decides; else the local Ollama model (--llm local, cached); else gate_review.jsonl.
    Judges must be PERSON; counsel that is an ORGANISATION becomes a firm / office; for parties the gate decides person vs
    organisation (undecided parties use the probablepeople vote, which was the more accurate model on the pilot answer key:
    0.936 vs spaCy 0.832 vs the old keyword list 0.910). en_core_web_md was chosen over en_core_web_sm on the same check.'
  spacy_model: en_core_web_md
  counsel_organisation:
    source: 'user (finish job, fix 2) - firm = a counsel entry the gate calls an ORGANISATION becomes a firm / office mention
      (the spec); counsel = it stays a counsel mention, marked in its context. The pilot answer key has no firms from the
      counsel field, so "firm" lowers firm extraction precision on the key (0.9813 -> 0.9620); "counsel" keeps it at 0.9813.
      Chosen by the user: counsel. Such mentions carry context is_organisation [true], also in the export files.'
    value: counsel
  ollama:
    url: "http://127.0.0.1:11434"
    model: "qwen2.5:7b"
    timeout_s: 60

# ---------------------------------------------------------------- document / generic JSON readers (v3_readers.py)
documents:
  source: 'user (finish job, fix 7) - names in OCR documents and other JSON are found by GLiNER2 (fastino/gliner2-base-v1) with
    these label descriptions, once per distinct text block (document_model_cache.jsonl). A name below min_entity_confidence goes
    to document_review.jsonl instead of becoming an entity (choice: GLiNER2''s own default threshold is 0.5, raised to 0.7 so
    entities need a clearly confident span).'
  gliner2_model: fastino/gliner2-base-v1
  model_threshold: 0.5
  min_entity_confidence: 0.7
  labels:
    judge: "name of a judge or magistrate judge"
    plaintiff: "name of a plaintiff, petitioner or applicant party in the case"
    defendant: "name of a defendant or respondent party in the case"
    party: "name of another party in the case"
    attorney: "name of a lawyer or attorney (signing, appearing, or being served)"
    address: "street or postal address"
    bar number: "attorney bar or registration number"
    law firm: "name of a law firm, legal office or government legal office"
    email: "email address"
    phone: "telephone number"
    mentioned: "organisation or person only mentioned in the text, not a participant in this case"
    organisation: "name of a company, agency, government body or other organisation"
  label_types: {judge: judge, plaintiff: party, defendant: party, party: party, attorney: counsel, "law firm": firm}
  label_sides: {plaintiff: plaintiff-side, defendant: defendant-side, party: other}
  contact_labels: [email, phone, address, bar number]
  organisation_labels: [organisation, "law firm"]   # model labels whose score is positive organisation evidence
  gate:
    source: 'user (document round 2, items 2 and 5) - document names pass the gate only with positive evidence: a person needs
      spaCy PERSON + probablepeople Person; an organisation needs spaCy ORG or an organisation-label score at or above a
      threshold calibrated on this run''s names that both models agree on (the lowest score whose names are org_precision
      organisations, with org_min_support names). A name that a strong participant label points to may enter with a lower
      model score: the lowest score at which such names pass the gate as often as those above the default threshold, within
      one standard error of that share or paired_tolerance, whichever is larger (paired_min_support names). Both thresholds are written to document_report.jsonl.'
    org_precision: 0.95
    org_min_support: 3
    org_score_floor: 0.8      # "a high model score": the calibrated organisation threshold is searched from here up (choice)
    paired_tolerance: 0.02
    paired_min_support: 3
  label_role_labels:
    source: 'user (document round 2, item 3) - what a form label means is read by GLiNER2 with these descriptions (a label can
      also name a non-participant: then the paired name is mentioned only)'
    judge: "the role judge or magistrate judge"
    plaintiff: "the role plaintiff, petitioner or applicant"
    defendant: "the role defendant or respondent"
    party: "the role party to the case"
    attorney: "the role lawyer or attorney"
    other role: "a role that is not a party, lawyer or judge in the case: an officer, deputy or clerk carrying out an order, a payee, victim, custodian, witness or similar"
  label_role_types: {judge: judge, plaintiff: party, defendant: party, party: party, attorney: counsel, "other role": nonparticipant}
  contact_min_confidence: 0.4   # choice: contact details only add evidence, so the model's own threshold range is enough
  template:
    source: 'user (document fixes, item 1) - the form template is learned from the data: a line whose normalised text (lower
      case, digits as #) is similar to a line in min_documents or more documents, and is not itself a confidently found name,
      is a template label. line_similarity absorbs OCR noise (rapidfuzz ratio; data - on the test files, OCR readings of the same
      label score 0.84-0.95 against each other). A label is paired with the nearest non-template line
      in its block (max_pair_lines), else the nearest line of a horizontally overlapping block on the same page
      (max_pair_gap_px, page pixels). The lines a document reader has seen are kept in document_model_cache.jsonl, so
      later runs learn from every document.'
    min_documents: 2
    line_similarity: 0.84
    label_max_words: 10        # a template line with more words, or ending in a period, is boilerplate prose, never a
                               # field label (choice)
    label_min_confidence: 0.5  # the model reading a label's role ("Printed name of party ..." -> party 0.59)
    nonparticipant_min_confidence: 0.8   # a non-participant role (payee, victim ...) needs a clear reading (choice)
    ngram_share: 0.6           # or: this share of the line's words sits in word 3-grams found in min_documents documents
                               # (catches a label with OCR junk appended; choice)
    prose_min_other_words: 6   # a name with more than this many other words on its line is inside prose (mentioned only),
                               # unless a form label points to it (choice: a signature line "Honorable <name>, U.S. District
                               # Court Judge" has 5; narrative sentences have 8+)
    prose_block_words: 8       # a block whose lines average this many words is prose: its names are mentions unless a form
                               # label points to them (choice: caption / signature / address blocks average 2-5)
    max_pair_lines: 3
    max_pair_gap_px: 100
    join_gap_px: 25            # consecutive short blocks this close (and overlapping horizontally) are one reading unit, so a
                               # name split by the layout model is read whole (choice: line spacing on the test pages is 30-60)
  field_labels:
    source: 'user (document fixes, items 1-2) - the meaning of a template label is decided by the zero-shot model (GLiNER2
      classification) from these descriptions; no label phrases are listed anywhere'
    "a form label for the name of a party (plaintiff, defendant, petitioner, the party signing or waiving)": party
    "a form label for the name or signature of a lawyer or attorney": counsel
    "a form label for the name or signature of a judge": judge
    "a form label for someone who is not a party, lawyer or judge (payee, victim, custodian, officer, witness)": nonparticipant
    "a form label for something else (a date, number, address, title, instruction or heading)": other
  one_role:
    source: 'user (document fixes, item 3) - one role per name per case: evidence from every document of the case is added
      (the model''s label confidences for the name, the paired form label''s meaning label_weight, an attached bar number /
      firm / address attached_counsel_weight); the top role must hold min_share of the evidence, else the name goes to
      document_review.jsonl (choice: 0.7 = a clear majority).'
    label_weight: 1.5
    person_party_label_weight: 0.5   # the model's plaintiff / defendant / party label for a PERSON name counts half: on
                                     # the test documents it gave those labels to judges and lawyers as well
    attached_counsel_weight: 3.0     # item 4: a person with a bar number, firm or address attached (same unit, or the
                                     # firm / address unit that follows a signature) is counsel - this outweighs model guesses
    contact_max_people: 3            # ... when the unit names at most this many persons
    min_share: 0.7

# ---------------------------------------------------------------- party roles (clean-up job)
party_roles:
  source: 'data (roles_report.json - all distinct parties[].party_type and role values in the large-district run + pilot). party_type decides the side
    when it is plaintiff or defendant; for other_party / misc / bk_party the role decides; everything else is "other".'
  side_by_party_type: {plaintiff: plaintiff-side, defendant: defendant-side}
  side_by_role:
    "Counter Defendant": plaintiff-side
    "Consolidated Counter Defendant": plaintiff-side
    "Plaintiff/Counter Defendant": plaintiff-side
    "Counter Claimant": defendant-side
    "Consolidated Counter Claimant": defendant-side
    "Defendant/Counter Plaintiff": defendant-side
    "Nominal Defendent": defendant-side
    "Defendant, 3rd Party Plaintiff": defendant-side
  default_side: other

# ---------------------------------------------------------------- logging / run
uncertain_log:
  source: choice (keeps uncertain_pairs.jsonl readable)
  max_candidates_per_mention: 3
  max_courts_shown: 10

progress_every:
  source: user (progress step)
  files: 500

removed_unused:
  source: audit (step 1) - defined in the code but never used; removed, behaviour unchanged. Finish job (fix 2 / fix 3) - lists
    replaced by the name gate or by the parser-based organisation normalisation, because those did as well or better on the pilot
  items:
    - non_judge_docket_keywords (substring list; it dropped real judges whose names contain e.g. "ill"; replaced by the name gate)
    - judges.non_name_words (docket event words; replaced by the name gate - a judge must be a PERSON)
    - org_party_words (person vs organisation keyword list, 0.910 on the pilot key; replaced by the name gate, 0.936+)
    - type_gate.court_staff_phrases for names (replaced by the name gate; kept only as rawinfo_staff_phrases for roles)
    - type_gate.model / undecided_min_cases (GLiNER2 Stage 2; replaced by the name gate)
    - corp_suffix_words, organisations.legal_forms / abbreviations / collapse_single_letters / division (replaced by
      v3_names.org_parts - probablepeople CorporationLegalType, office field from parentheses or a final dash)
    - COMMON_NAMES (notebook's old Rule 4 list; the context matcher never used it)
    - ORG_WORDS (replaced by org_party_words in ctx2)
